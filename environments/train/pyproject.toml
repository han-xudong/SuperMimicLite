[project]
name = "g1-training-environment"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "active-adaptation", "mimic-lite", "mjlab==1.6.0", "unilab==1.5.1",
  "unisim-core==2.1.1", "gymnasium==1.3.0", "rsl-rl-lib==5.5.1",
  "mujoco==3.11.0", "mujoco-warp==3.11.0", "warp-lang==1.14.0",
  "numpy==2.4.4", "tensordict==0.13.0", "torchrl==0.13.1",
  "hydra-core==1.3.3", "omegaconf==2.3.1", "scipy==1.17.1",
  "hoptorch==0.1.4", "torchrunx==0.3.4",
]
[tool.uv]
package = false
override-dependencies = ["torch==2.11.0", "torchvision==0.26.0", "torchaudio==2.11.0", "rsl-rl-lib==5.5.1", "gymnasium==1.3.0", "any4hdmi @ git+https://github.com/EGalahad/any4hdmi.git@bf83602f36ff6fc9796367cfc2b707a2526e1a54", "mjhub @ git+https://github.com/EGalahad/mjhub.git@f118fae0e54aeb3484a9f576658217528427042b"]
[tool.uv.sources]
active-adaptation = {path = "../../third_party/active-adaptation", editable = true}
mimic-lite = {path = "../../third_party/active-adaptation/projects/mimic-lite", editable = true}
torch = {index = "pytorch-cu128"}
torchvision = {index = "pytorch-cu128"}
torchaudio = {index = "pytorch-cu128"}
simple-raycaster = {git = "https://github.com/btx0424/simple-raycaster.git", rev = "fde9e817472817471fae3030f4175f7465db622b"}
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
